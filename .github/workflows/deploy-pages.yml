name: Build and deploy MeowEdit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch the canonical contract doc
        env:
          GH_TOKEN: ${{ secrets.MEOWEDIT_AUTHORITY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .authority
          if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/Meowdieval-Kingdom/MeowdievalKingdom/contents/Docs/MeowEdit-Content-Contract.md?ref=feature/adventure-map-content" \
            -o .authority/MeowEdit-Content-Contract.md; then
            echo "MEOWEDIT_AUTHORITY_DOC=${{ github.workspace }}/.authority/MeowEdit-Content-Contract.md" >> "$GITHUB_ENV"
          else
            echo "::warning::Canonical contract doc is not readable with this token; the checked-in schema.sha256 gate still applies."
          fi
      - name: Verify the content contract
        run: npm run contract:check
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build the static app
        env:
          VITE_NEON_AUTH_BASE_URL: ${{ vars.MEOWEDIT_NEON_AUTH_BASE_URL }}
          VITE_GAME_API_BASE_URL: ${{ vars.MEOWEDIT_GAME_API_BASE_URL }}
        run: |
          test -n "$VITE_NEON_AUTH_BASE_URL" || { echo "MEOWEDIT_NEON_AUTH_BASE_URL is not configured"; exit 1; }
          test -n "$VITE_GAME_API_BASE_URL" || { echo "MEOWEDIT_GAME_API_BASE_URL is not configured"; exit 1; }
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
