name: Build and deploy MeowEdit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify the content contract
        env:
          MEOWEDIT_SKIP_AUTHORITY_DOC: "1"
        run: npm run contract:check
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build the static app
        env:
          VITE_NEON_AUTH_BASE_URL: ${{ vars.MEOWEDIT_NEON_AUTH_BASE_URL }}
          VITE_GAME_API_BASE_URL: ${{ vars.MEOWEDIT_GAME_API_BASE_URL }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
